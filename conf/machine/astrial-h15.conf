require conf/machine/hailo15-base.inc
UBOOT_MACHINE = "astrial-h15_defconfig"
#UBOOT_MACHINE = "hailo15_evb_security_camera_defconfig"
# Base tree plus the panel variants. Each entry becomes a FIT configuration,
# selectable at boot without reflashing: board_dtb picks a whole tree,
# dtb_overlays stacks overlays on top of it. Both live in the U-Boot
# environment and are writable from Linux with fw_setenv.
KERNEL_DEVICETREE = "sysele/astrial-h15.dtb sysele/astrial-h15-ws101.dtb sysele/panel-ws101.dtbo sysele/touch-ws101.dtbo"

# Readable labels for sysele-config, which builds its list from the
# KERNEL_DEVICETREE above. They sit next to it so the two cannot age apart: a
# tree added without its label still shows up, under its own name.
# No double quotes here, they would end the bitbake value early.
SYSELE_DT_LABELS = "\
astrial-h15=raspberry pi display and touch, 7 inch, 800x480|\
astrial-h15-ws101=waveshare display and touch, 10.1 inch, 1280x800, whole tree|\
panel-ws101=waveshare display and touch, 10.1 inch, 1280x800, overlay bundle|\
touch-ws101=waveshare Goodix touch, standalone overlay\
"

# Fix GStreamer version warnings - update to available version
PREFERRED_VERSION_gstreamer1.0 = "1.20.7"
PREFERRED_VERSION_gstreamer1.0-plugins-base = "1.20.7"

# Suppress QA warnings for proprietary licenses
WARN_QA:remove = "obsolete-license license-file-missing"

# Ripiego automatico sull'altro slot (A/B). Spento: con questi valori i due
# scu_bl_cfg generati sono identici a quelli di Hailo e niente cambia.
#
# Per accenderlo: 0x00078000, 0x02 e 2. Le liste diventano A,B,A e B,A,B, e
# l'immagine si tira dietro da sola sysele-slot-sync e il watchdog, senza cui
# il ripiego non scatterebbe mai. Resta da programmare lo slot B a mano.
SYSELE_SCU_FALLBACK_OFFSET ?= "0x00000000"
SYSELE_SCU_BOOT_RETRIES ?= "0xFF"
SYSELE_SCU_LAST_VALID_DESC ?= "0"

# Derivata dall'offset, non si imposta a mano: dice se il ripiego e' acceso.
SYSELE_SCU_AB = "${@'0' if (d.getVar('SYSELE_SCU_FALLBACK_OFFSET') or '').strip() in ('0x00000000', '0x0', '0', '') else '1'}"
